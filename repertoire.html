<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Répertoire — NyXia</title>
<link rel="icon" type="image/png" href="/FavIcon.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0A1628; --card:rgba(123,92,255,.06); --border:rgba(123,92,255,.15);
  --p:#7B5CFF; --p2:#5A6CFF; --t:#fff; --t2:#D6D9F0; --t3:#8891B8; --t4:#4a5278; --green:#00E676; --gold:#F4C842;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg1);color:var(--t2);font-family:Outfit,sans-serif}
#starry-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:700}
.brand-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;font-size:16px}
h1{font-family:'Space Grotesk',sans-serif;font-size:28px;color:#fff;margin-bottom:6px}
.sub{color:var(--t3);font-size:14px;margin-bottom:22px;line-height:1.5;max-width:560px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
input[type="search"]{
  flex:1;min-width:200px;padding:12px 16px;border-radius:50px;border:1px solid rgba(123,92,255,.25);
  background:rgba(15,28,63,.55);color:#fff;font-family:Outfit,sans-serif;font-size:14px;outline:none
}
.chip{padding:8px 14px;border-radius:50px;border:1px solid rgba(123,92,255,.2);background:transparent;color:var(--t3);font-size:12px;cursor:pointer;font-family:Outfit,sans-serif}
.chip.active{background:rgba(123,92,255,.22);color:#fff;border-color:rgba(123,92,255,.45)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;
  display:flex;flex-direction:column;transition:border-color .2s, transform .2s
}
.card:hover{border-color:rgba(123,92,255,.4);transform:translateY(-2px)}
.thumb{
  height:150px;background:rgba(15,28,63,.7);display:flex;align-items:center;justify-content:center;
  color:var(--t4);font-size:32px;overflow:hidden
}
.thumb img{width:100%;height:100%;object-fit:cover}
.body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h2{font-size:16px;color:#fff;font-weight:600;line-height:1.35}
.body p{font-size:13px;color:var(--t3);line-height:1.45;flex:1}
.price{font-family:'Space Grotesk',sans-serif;font-size:18px;color:var(--green);font-weight:700}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.btn{
  padding:10px 14px;border-radius:12px;border:none;cursor:pointer;font-weight:600;font-size:12px;
  background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-family:Outfit,sans-serif;text-decoration:none;display:inline-block
}
.btn-ghost{background:rgba(123,92,255,.12);border:1px solid rgba(123,92,255,.3)}
.empty{text-align:center;padding:60px 16px;color:var(--t3);grid-column:1/-1}
.empty strong{display:block;color:#fff;font-size:16px;margin-bottom:8px}
.badge{font-size:11px;padding:3px 8px;border-radius:50px;background:rgba(244,200,66,.15);color:var(--gold)}
</style>
</head>
<body>
<canvas id="starry-canvas"></canvas>
<div class="wrap">
  <header>
    <a class="brand" href="/repertoire.html"><span class="brand-mark">✦</span> Répertoire NyXia</a>
  </header>

  <h1>Répertoire</h1>
  <p class="sub">Les produits du cercle d’entraide. Explore, choisis, partage — simplement.</p>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Rechercher un produit…" oninput="render()">
    <button type="button" class="chip active" data-f="all" onclick="setFilter('all', this)">Tous</button>
  </div>

  <div class="grid" id="grid">
    <div class="empty">Chargement du répertoire…</div>
  </div>
</div>

<script src="/starry-bg.js" defer></script>
<script>
var ALL = [];
var FILTER = 'all';

function money(n) {
  return Number(n || 0).toLocaleString('fr-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' $';
}
function setFilter(f, el) {
  FILTER = f;
  document.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
  if (el) el.classList.add('active');
  render();
}
function render() {
  var q = (document.getElementById('q').value || '').toLowerCase().trim();
  var list = ALL.filter(function (p) {
    if (!q) return true;
    var t = (p.title || '') + ' ' + (p.description_short || '');
    return t.toLowerCase().indexOf(q) >= 0;
  });
  var grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = '<div class="empty"><strong>Aucun produit pour le moment</strong>Les offres publiées apparaîtront ici.</div>';
    return;
  }
  grid.innerHTML = list.map(function (p) {
    var img = p.image_url
      ? '<img src="' + escapeAttr(p.image_url) + '" alt="">'
      : '✦';
    var desc = (p.description_short || '').slice(0, 120);
    var promo = p.promo_code ? '<span class="badge">' + escapeHtml(p.promo_code) + '</span>' : '';
    var href = p.affiliate_link || ('/produit.html?id=' + encodeURIComponent(p.id));
    return (
      '<article class="card">' +
        '<div class="thumb">' + img + '</div>' +
        '<div class="body">' +
          '<h2>' + escapeHtml(p.title || 'Sans titre') + '</h2>' +
          '<p>' + escapeHtml(desc) + (desc.length >= 120 ? '…' : '') + '</p>' +
          '<div class="foot">' +
            '<div class="price">' + money(p.price) + '</div>' + promo +
          '</div>' +
          '<div class="foot">' +
            '<a class="btn" href="' + escapeAttr(href) + '">Voir</a>' +
          '</div>' +
        '</div>' +
      '</article>'
    );
  }).join('');
}
function escapeHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/'/g, '&#39;');
}
fetch('/api/repertoire')
  .then(function (r) { return r.json(); })
  .then(function (data) {
    ALL = data.products || [];
    render();
  })
  .catch(function () {
    document.getElementById('grid').innerHTML =
      '<div class="empty"><strong>Répertoire indisponible</strong>Réessaie dans un instant.</div>';
  });
</script>
</body>
</html>
